user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not include image default conf.d to avoid conflicting server blocks
    # include /etc/nginx/conf.d/*.conf;
    # include HTTP-level rate limit zones
    include /etc/nginx/rate-limiting-zones.conf;

    log_format security_log '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           '$request_time $upstream_response_time '
                           '$http_x_forwarded_for';

    access_log /var/log/nginx/access.log security_log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting zones are defined in included rate-limiting.conf

    upstream api_backend {
        # Use Docker Compose service name so nginx in container can reach the backend
        server backend:4000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Static files for frontend
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Include centralized rate-limiting locations (defines /api/ etc.)
        include /etc/nginx/rate-limiting.conf;

        # Health check
        location /health {
            access_log off;
            return 200 '{"status":"healthy"}';
        }
    }
}