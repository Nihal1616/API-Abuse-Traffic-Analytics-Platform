version: '3.8'

services:
  # MongoDB database
  mongodb:
    image: mongo:6.0
    container_name: api-shield-mongodb
    ports:
      - "27018:27017"  # Changed from 27017 to 27018 to avoid conflict
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=apishield
    volumes:
      - mongodb_data:/data/db
      - ./backend/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - api-shield-network
    restart: unless-stopped
    command: mongod --auth

  # MongoDB Express (Web UI)
  mongo-express:
    image: mongo-express:latest
    container_name: api-shield-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD}
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD}
    depends_on:
      - mongodb
    networks:
      - api-shield-network
    restart: unless-stopped

  # Redis for caching and rate limiting
  redis:
    image: redis:alpine
    container_name: api-shield-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - api-shield-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Node.js API Backend
  backend:
    build: ./backend
    container_name: api-shield-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY=${API_KEY}
      - MONGODB_URI=mongodb://admin:${MONGO_PASSWORD}@mongodb:27017/apishield?authSource=admin
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      - mongodb
      - redis
    networks:
      - api-shield-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build: ./frontend
    container_name: api-shield-frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - api-shield-network
    restart: unless-stopped

  # Nginx reverse proxy (optional - for production deployment)
  nginx:
    image: nginx:alpine
    container_name: api-shield-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/config/nginx.conf:/etc/nginx/nginx.conf
      - ./backend/config/security-headers.conf:/etc/nginx/security-headers.conf
      - ./backend/config/rate-limiting.conf:/etc/nginx/rate-limiting.conf
      - ./backend/logs/nginx:/var/log/nginx
      - ./ssl:/etc/ssl/certs
    depends_on:
      - backend
      - frontend
    networks:
      - api-shield-network
    restart: unless-stopped
    profiles:
      - production

networks:
  api-shield-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data: