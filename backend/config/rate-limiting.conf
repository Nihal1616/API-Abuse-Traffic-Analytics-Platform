# Rate Limiting Configuration (location-level)
# HTTP-level zones and connection limits are defined in rate-limiting-zones.conf
# This file contains only location directives to be included inside server{}
# Rate limiting for different endpoints
location ~ ^/api/v1/auth/ {
    limit_req zone=auth_endpoints burst=20 nodelay;
    limit_req_status 429;
}

location ~ ^/api/admin/ {
    limit_req zone=admin_endpoints burst=10 nodelay;
    limit_req_status 429;
    
    # Additional security for admin endpoints
    satisfy any;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    deny all;
    
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
}

location ~ ^/api/ {
    limit_req zone=api_global burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}

# Static files - no rate limiting
location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Health endpoint handled in main nginx.conf (avoid duplicate location)

# Real-time endpoints (WebSocket/SSE)
location /socket.io/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Higher timeouts for WebSocket
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;
}