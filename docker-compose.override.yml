# Development override for docker-compose.yml
# This file is automatically merged with docker-compose.yml when running docker-compose

version: '3.8'

services:
  # Override backend for development
  backend:
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - RECAPTCHA_SECRET=${RECAPTCHA_SECRET}
      - RECAPTCHA_MIN_SCORE=${RECAPTCHA_MIN_SCORE}
      - RECAPTCHA_EXEMPT_ROUTES=${RECAPTCHA_EXEMPT_ROUTES}
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  # Override frontend for development
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_RECAPTCHA_SITE_KEY=${VITE_RECAPTCHA_SITE_KEY}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]