# Rate Limiting Configuration

# Define rate limit zones
limit_req_zone $binary_remote_addr zone=api_global:10m rate=1000r/m;
limit_req_zone $binary_remote_addr zone=auth_endpoints:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=admin_endpoints:10m rate=50r/m;
limit_req_zone $binary_remote_addr zone=strict_zone:10m rate=10r/m;

# Define connection limit zones
limit_conn_zone $binary_remote_addr zone=addr:10m;
limit_conn_zone $server_name zone=perserver:10m;

# Connection limits
limit_conn addr 10;
limit_conn perserver 100;

# Request body size limit
client_max_body_size 10m;

# Buffer size for request body
client_body_buffer_size 128k;

# Timeouts
client_body_timeout 12;
client_header_timeout 12;
keepalive_timeout 15;
send_timeout 10;

# Rate limiting for different endpoints
location ~ ^/api/v1/auth/ {
    limit_req zone=auth_endpoints burst=20 nodelay;
    limit_req_status 429;
}

location ~ ^/api/admin/ {
    limit_req zone=admin_endpoints burst=10 nodelay;
    limit_req_status 429;
    
    # Additional security for admin endpoints
    satisfy any;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    deny all;
    
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
}

location ~ ^/api/ {
    limit_req zone=api_global burst=50 nodelay;
    limit_req_status 429;
}

# Static files - no rate limiting
location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Health endpoint - no rate limiting
location /health {
    access_log off;
    add_header Content-Type application/json;
    return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
}

# Real-time endpoints (WebSocket/SSE)
location /socket.io/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Higher timeouts for WebSocket
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;
}